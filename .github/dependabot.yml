version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Python (uv/pip)
  - package-ecosystem: pip
    directory: /apps/data-pipeline
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  # JavaScript (bun/npm)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-deps:
        patterns: ["*"]

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # let deploys finish

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      demo: ${{ steps.filter.outputs.demo }}
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
            demo:
              - 'data/DEMO/**'
              - 'apps/web/scripts/sync-demo-workspace-to-r2.ts'
              - 'apps/web/package.json'
              - 'bun.lock'
              - '.github/workflows/deploy.yml'
            python:
              - 'apps/data-pipeline/**'
              - 'packages/api-types/**'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
            docs:
              - 'README.md'
              - 'docs/**'
              - '.markdownlint-docs.json'
              - 'cspell.config.json'
              - 'scripts/codegen_docs_latex.js'
              - 'apps/data-pipeline/**'
              - 'packages/api-types/**'
              - 'bun.lock'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'

  ci-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-web-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-web-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run --cwd apps/web check

  ci-api-types:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - run: uv sync --frozen
        working-directory: apps/data-pipeline

      - run: bun install --frozen-lockfile

      - run: bun run --cwd packages/api-types check

  ci-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Cache JAX compilations
        uses: actions/cache@v4
        with:
          path: ~/.cache/nof1-causal-lab/jax
          key: jax-${{ runner.os }}-${{ hashFiles('apps/data-pipeline/uv.lock') }}-${{ hashFiles('apps/data-pipeline/src/**/*.py') }}
          restore-keys: |
            jax-${{ runner.os }}-${{ hashFiles('apps/data-pipeline/uv.lock') }}-
            jax-${{ runner.os }}-

      - run: uv sync --frozen --group dev
        working-directory: apps/data-pipeline

      - run: bun run --cwd apps/data-pipeline check

  ci-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - run: uv sync --frozen
        working-directory: apps/data-pipeline

      - run: bun install --frozen-lockfile

      - run: bun run docs:check

  # ---------------------------------------------------------------------------
  # Deploy Modal functions (stages 2, 4, 5b)
  # GitHub secrets → Modal secret block → env vars inside containers
  # ---------------------------------------------------------------------------
  deploy-modal:
    needs: [changes, ci-python]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-pipeline
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev --group cloud
      - name: Sync runtime secrets to Modal
        run: |
          uv run modal secret create --force nof1-causal-lab-pipeline-secrets \
            DEPLOYMENT_ENV=production \
            OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            GOOGLE_CLOUD_PROJECT="${{ secrets.GOOGLE_CLOUD_PROJECT }}" \
            GOOGLE_CLOUD_LOCATION="${{ secrets.GOOGLE_CLOUD_LOCATION }}" \
            EXA_API_KEY="${{ secrets.EXA_API_KEY }}" \
            R2_ENDPOINT_URL="${{ secrets.R2_ENDPOINT_URL }}" \
            R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
            R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            R2_BUCKET="${{ secrets.R2_BUCKET }}" \
            R2_PREFIX=data
      - run: uv run modal deploy src/nof1_causal_lab/flows/modal_runners.py

  # ---------------------------------------------------------------------------
  # Upload public demo workspace artifacts to R2
  # Public shared workspaces are data artifacts, so syncing them should not
  # force a Vercel deployment when the web app code has not changed.
  # ---------------------------------------------------------------------------
  sync-demo-r2:
    needs: changes
    if: needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - name: Upload demo workspace to R2
        run: bun run --cwd apps/web sync-demo-r2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: data

  # ---------------------------------------------------------------------------
  # Deploy web app to Vercel (production)
  # GitHub secrets → Vercel env vars → available at runtime
  # ---------------------------------------------------------------------------
  deploy-vercel:
    needs: [changes, ci-web]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - name: Sync runtime secrets to Vercel
        run: |
          sync_required_env() {
            if [ -z "$2" ]; then
              echo "$1 is required for Vercel deployment" >&2
              exit 1
            fi
            printf '%s' "$2" | bunx vercel env add "$1" production --yes --force --token="$VERCEL_TOKEN"
          }
          sync_env() { printf '%s' "$2" | bunx vercel env add "$1" production --yes --force --token="$VERCEL_TOKEN"; }
          sync_env DEPLOYMENT_ENV           production
          sync_required_env APP_SECRET           "${{ secrets.APP_SECRET }}"
          sync_required_env OPENROUTER_API_KEY   "${{ secrets.OPENROUTER_API_KEY }}"
          sync_env R2_ENDPOINT_URL          "${{ secrets.R2_ENDPOINT_URL }}"
          sync_env R2_ACCESS_KEY_ID         "${{ secrets.R2_ACCESS_KEY_ID }}"
          sync_env R2_SECRET_ACCESS_KEY     "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          sync_env R2_BUCKET                "${{ secrets.R2_BUCKET }}"
          sync_env R2_PREFIX                data
      - run: bunx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: bunx vercel build --prod --token="$VERCEL_TOKEN"
      - run: bunx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"


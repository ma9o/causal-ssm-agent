name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: false # let deploys finish

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Deploy Modal functions (stages 2 + 5b)
  # ---------------------------------------------------------------------------
  deploy-modal:
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run modal deploy src/causal_ssm_agent/flows/modal_runners.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}


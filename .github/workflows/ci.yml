name: CI

on:
  pull_request:
  workflow_call:
    outputs:
      web:
        value: ${{ jobs.changes.outputs.web }}
      python:
        value: ${{ jobs.changes.outputs.python }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'package.json'
              - '.github/workflows/ci.yml'
            python:
              - 'apps/data-pipeline/**'
              - 'packages/api-types/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-web-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-web-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run lint --filter='!@causal-ssm/data-pipeline'
      - run: bun run test --filter='!@causal-ssm/data-pipeline'
      - run: bun run build
      - run: bun run type-check

  codegen:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - run: uv sync --frozen
        working-directory: apps/data-pipeline

      - run: bun install --frozen-lockfile

      - run: bun run --cwd packages/api-types codegen:check

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-pipeline
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache JAX compilations
        uses: actions/cache@v5
        with:
          path: ~/.cache/causal-ssm-agent/jax
          key: jax-${{ runner.os }}-${{ hashFiles('apps/data-pipeline/uv.lock') }}-${{ hashFiles('apps/data-pipeline/src/**/*.py') }}
          restore-keys: |
            jax-${{ runner.os }}-${{ hashFiles('apps/data-pipeline/uv.lock') }}-
            jax-${{ runner.os }}-

      - run: uv sync --frozen --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run pytest tests/ -m 'not slow'

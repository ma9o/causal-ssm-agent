[project]
name = "nof1-causal-lab"
version = "0.1.0"
description = "LLM-orchestrated causal inference over long-context, multi-source data"
readme = "../../README.md"
license = "Apache-2.0"
authors = [
    { name = "ma9o" }
]
requires-python = ">=3.12"
dependencies = [
    "arviz-base>=1.2.0,<1.4.0",
    "arviz-stats[xarray]>=1.2.0,<1.4.0",
    "blackjax>=1.6.2",
    "cloudpickle>=3.1.1",
    "diffrax>=0.6.0",
    "equinox>=0.13.8",
    "exa-py>=1.0.0",
    "fastapi>=0.115.0",
    "fsspec>=2024.2.0",
    "jax>=0.4.35",
    "httpx>=0.27.0",
    "jaxtyping>=0.3.0",
    "mcp>=1.0.0",
    "openai>=2.20.0",
    "optimistix>=0.0.9",
    "networkx>=3.6",
    "numpy>=2.3.3",
    "numpyro>=0.21.0",
    "polars>=1.35.2",
    "pydantic>=2.11.9",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.2.1",
    "scipy>=1.13.0",
    "typing-extensions>=4.10.0",
    "uvicorn>=0.31.1",
    "y0 @ git+https://github.com/y0-causal-inference/y0.git",
    "temporalio>=1.30.0",
]

[project.scripts]
nof1-publish = "nof1_causal_lab.publish:main"
nof1-sweep = "nof1_causal_lab.machine.sweep:sweep_cli"

[build-system]
requires = ["uv_build>=0.11.28,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
cloud = [
    "modal>=1.3.2",
    "s3fs>=2024.2.0",
]
eval = [
    "inspect-ai>=0.3.162",
]
dev = [
    "beartype>=0.19.0",
    "deptry>=0.25.1",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.7",
    "jupyter-client>=8.8.0",
    "marimo>=0.23.11",
    "matplotlib>=3.10.0",
    "nbconvert>=7.16.6",
    "nbformat>=5.10.4",
    "plotly>=6.7.0",
    # slim[openai], NOT full pydantic-ai: the full meta-package pulls every
    # provider extra, whose combined pins cap resolution at 1.38.0 — below
    # marimo's required pydantic-ai-slim[openai]>=1.107.0 (OpenAIChatCompatibleProvider).
    "pydantic-ai-slim[openai]>=1.107.0,<3.0.0",
    "pymc>=6.1.0",
    "pytest>=9.0.2",
    "pytest-instafail>=0.5.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "ruff>=0.9.0",
    "ty>=0.0.61",
    "vulture>=2.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "evaluation"]
fix = true
# notebooks/data holds study fixtures and their data generators, not source code
extend-exclude = ["notebooks/data"]

[tool.ruff.lint]
external = ["V"]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "NPY",    # NumPy-specific rules
    "PERF",   # Perflint
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "S324",   # insecure hash functions
    "S608",   # string-built SQL
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F722",   # jaxtyping shape annotations are strings ruff treats as forward refs
    "PERF401",# list/dict comprehension nudges are too noisy for legacy code
    "PERF403",# dict comprehension nudges are too noisy for legacy code
    "SIM108", # use ternary operator (not always clearer)
    "RUF001", # ambiguous unicode in strings (intentional for display)
    "RUF002", # ambiguous unicode in docstrings (intentional for scientific notation)
    "RUF003", # ambiguous unicode in comments (intentional for scientific notation)
    "RUF022", # __all__ not sorted (comments prevent auto-sort)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "ARG001",  # unused function arguments (pytest fixtures)
    "ARG002",  # unused method arguments (pytest fixtures)
    "DTZ001",  # tests intentionally use naive datetimes as compact fixtures
]
"tests/**/*.py" = [
    "ARG001",  # unused function arguments (pytest fixtures)
    "ARG002",  # unused method arguments (pytest fixtures)
    "DTZ001",  # tests intentionally use naive datetimes as compact fixtures
]
"notebooks/**/*.py" = [
    "C408",  # plotly figure kwargs idiomatically use dict(...), not {} literals
    "E731",  # one-line math lambdas (e.g. φ = a·b) read clearly in gallery cells
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "tuple"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = ["nof1_causal_lab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.vulture]
# src must prove its own liveness. scripts/run_vulture.py checks evaluation,
# scripts, notebooks, and tests as independent ownership seams; none of them can
# keep a definition in src alive.
paths = ["src"]
# notebooks/data holds study fixtures and their data generators, not source code
exclude = ["*notebooks/data*"]
min_confidence = 60
sort_by_size = true
ignore_decorators = [
    "@task",
    "@flow",
    "@pytest.fixture",
    "@solver",
    "@scorer",
    "@app.*",
    "@router.*",
    "@*_router.*",
    "@register_*",
    "@field_validator",
    "@model_validator",
    "@validator",
    "@root_validator",
    "@computed_field",
    "@property",
    "@*.defjvp",
    "@*.defvjp",
    "@*.list_tools",
    "@*.call_tool",
    "@workflow.signal",
    "@workflow.update",
    "@workflow.query",
    # MCP gateway tools are invoked by the MCP runtime, never by our code
    "@mcp.tool",
]
ignore_names = [
    "test_*",
    "model",
    "model_config",
    "pytestmark",
    "should_exit",
    "exc_type",
    "exc_val",
    "exc_tb",
    # marimo notebooks emit this module-level provenance stamp (used by marimo, not us)
    "__generated_with",
    # jax.profiler.ProfileOptions attributes (consumed by JAX, invisible to vulture)
    "host_tracer_level",
    "python_tracer_level",
    "include_dataset_ops",
    "enable_hlo_proto",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "notebooks", "evaluation", "scripts", "tests"]
# notebooks/data contains study fixtures and their standalone generators.
exclude = ["notebooks/data"]

[tool.ty.rules]
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-unresolved-reference = "error"
unused-type-ignore-comment = "error"

[tool.deptry]
known_first_party = ["nof1_causal_lab"]
non_dev_dependency_groups = ["cloud"]

[tool.deptry.per_rule_ignores]
# fsspec discovers s3fs by protocol; production code never imports the backend directly.
DEP002 = ["s3fs"]

[tool.ty.analysis]
respect-type-ignore-comments = true
# These dependencies do not publish PEP 561 typing metadata, so ty treats their
# import boundary as `Any`. The ArviZ component packages, Equinox, diffrax,
# optimistix, and y0 publish typing metadata and remain checked.
replace-imports-with-any = [
    "blackjax.**",
    "numpyro.**",
]

[tool.pytest.ini_options]
addopts = "-n auto --tb=short -ra --instafail --timeout=300 --durations=10 --jaxtyping-packages=nof1_causal_lab.models.ssm.covariance_utils,nof1_causal_lab.models.ssm.discretization.exact,nof1_causal_lab.models.ssm.discretization.local_linearization,nof1_causal_lab.models.ssm.dynamics.steady_state,nof1_causal_lab.models.ssm.dynamics.vector_field,nof1_causal_lab.models.ssm.execution.emissions,nof1_causal_lab.models.ssm.execution.euler_maruyama,nof1_causal_lab.models.ssm.execution.observation_kernel_helpers,nof1_causal_lab.models.ssm.inference.methods.marginal_particle_gibbs._math,nof1_causal_lab.models.ssm.inference.targets.transitions,beartype.beartype"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[project]
name = "nof1-causal-lab"
version = "0.1.0"
description = "LLM-orchestrated causal inference over long-context, multi-source data"
readme = "../../README.md"
license = "Apache-2.0"
authors = [
    { name = "ma9o" }
]
requires-python = ">=3.12"
dependencies = [
    "arviz>=0.19.0",
    "blackjax>=1.2.0",
    "cloudpickle>=3.1.1",
    "cuthbert>=0.0.10",
    "equinox>=0.11.0",
    "exa-py>=1.0.0",
    "fastapi>=0.115.0",
    "fsspec>=2024.2.0",
    "jax>=0.4.35",
    "jaxlib>=0.4.35",
    "libsql>=0.1.5",
    "mcp>=1.0.0",
    "openai>=2.20.0",
    "networkx>=3.6",
    "numpy>=2.3.3",
    "numpyro>=0.16.0",
    "optax>=0.2.0",
    "polars>=1.35.2",
    "prefect>=3.6.5",
    "pydantic>=2.11.9",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.7.2",
    "y0 @ git+https://github.com/y0-causal-inference/y0.git",
    "ipython>=9.12.0",
]

[build-system]
requires = ["uv_build>=0.8.24,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
cloud = [
    "modal>=1.3.2",
    "s3fs>=2024.2.0",
]
eval = [
    "inspect-ai>=0.3.162",
]
dev = [
    "ipykernel>=7.2.0",
    "jupyter-client>=8.8.0",
    "nbconvert>=7.16.6",
    "nbformat>=5.10.4",
    "plotly>=6.7.0",
    "pytest>=9.0.2",
    "pytest-instafail>=0.5.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
fix = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "NPY",    # NumPy-specific rules
    "PERF",   # Perflint
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "S324",   # insecure hash functions
    "S608",   # string-built SQL
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PERF401",# list/dict comprehension nudges are too noisy for legacy code
    "PERF403",# dict comprehension nudges are too noisy for legacy code
    "SIM108", # use ternary operator (not always clearer)
    "RUF001", # ambiguous unicode (intentional for display)
    "RUF022", # __all__ not sorted (comments prevent auto-sort)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "ARG001",  # unused function arguments (pytest fixtures)
    "ARG002",  # unused method arguments (pytest fixtures)
    "DTZ001",  # tests intentionally use naive datetimes as compact fixtures
]
"tests/**/*.py" = [
    "ARG001",  # unused function arguments (pytest fixtures)
    "ARG002",  # unused method arguments (pytest fixtures)
    "DTZ001",  # tests intentionally use naive datetimes as compact fixtures
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "tuple"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = ["nof1_causal_lab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
addopts = "-n auto --tb=short -ra --instafail --timeout=300 --durations=10"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

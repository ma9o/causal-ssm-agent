# Causal Agent Pipeline Configuration

# --- LLM backend defaults --------------------------------------------------
# Each stage below picks a harness via `llm.harness`; these defaults apply
# when a stage doesn't override individual fields.
llm:
  # harness: none  (OpenRouter direct)
  embedded:
    max_tokens: 65536
    timeout: 900
    reasoning_effort: xhigh

  # harness: claude-code  (spawns `claude -p`)
  claude_code:
    bin: claude
    effort: high          # low | medium | high | xhigh | max
    max_turns: 40
    max_budget_usd: null
    fallback_model: null

  # harness: codex  (spawns `codex exec`)
  codex:
    bin: codex
    reasoning_effort: high  # low | medium | high | xhigh | max

# --- Stages ----------------------------------------------------------------

# Stage 0: Agentic Data Ingestion
stage0_ingestion:
  max_tool_turns: 40
  llm:
    harness: none
    model: openrouter/xiaomi/mimo-v2-pro

# Stage 1: Structure Proposal (Orchestrator)
stage1_structure_proposal:
  sample_chunks: 10
  chunk_size: 100
  stage1a_max_tool_turns: 40
  stage1b_max_tool_turns: 40
  llm:
    harness: none
    model: openrouter/openai/gpt-5.4

# Stage 2: Support-Window Extraction (Workers)
# Stage 2 fans out across thousands of workers; harness cold-start per worker
# is untenable, so `harness` is locked to `none` (enforced by config validator).
stage2_workers:
  windows_per_chunk: 1
  max_concurrent_workers: 30
  max_events_per_window: 300
  max_rpm: 450               # OpenRouter sliding-window RPM (embedded-only)
  worker_timeout: 120        # per-LLM-call timeout in seconds
  max_tool_turns: 40
  max_free_windows: 100
  llm:
    harness: none
    model: openrouter/google/gemini-3.1-flash-lite-preview

# Stage 3: Validation — no LLM (rule-based)

# Stage 4: Model Specification & Prior Elicitation
stage4_prior_elicitation:
  max_tool_turns: 100
  literature_search:
    enabled: true
  paraphrasing:
    enabled: false
    n_paraphrases: 10
    gmm_model: null          # optional; null = inherit stage's llm.model
  llm:
    harness: none
    model: openrouter/xiaomi/mimo-v2-pro

# Stages 5a/5b: Inference — no LLM (NumPyro SSM)

# Stage 6: Narrative Commentary
stage6_commentary:
  llm:
    harness: none
    model: openrouter/xiaomi/mimo-v2-pro

# --- Inference (unchanged) -------------------------------------------------
inference:
  method: auto
  num_warmup: 1000
  num_samples: 1000
  num_chains: 4
  seed: 0
  svi:
    num_steps: 5000
    learning_rate: 0.01
    guide_type: mvn
  nuts:
    target_accept_prob: 0.85
    max_tree_depth: 8
  smc:
    n_outer: 6
    n_csmc_particles: 8
    n_mh_steps: 3
    param_step_size: 0.05
    n_warmup: 3
    n_leapfrog: 1
    adaptive_tempering: false
    n_ieks_iters: 3

# N-of-1 Causal Lab Pipeline Configuration

# --- LLM backend defaults --------------------------------------------------
# Each stage below picks a harness via `llm.harness`; these defaults apply
# when a stage doesn't override individual fields.
llm:
  # harness: none  (OpenRouter direct)
  embedded:
    max_tokens: 65536
    timeout: 900
    reasoning_effort: xhigh

  # harness: claude-code  (spawns `claude -p`)
  claude_code:
    bin: claude
    effort: high          # low | medium | high | xhigh | max
    max_turns: 40
    max_budget_usd: null
    fallback_model: null

  # harness: codex  (spawns `codex exec`)
  codex:
    bin: codex
    reasoning_effort: xhigh  # low | medium | high | xhigh | max
    service_tier: fast

# --- Stages ----------------------------------------------------------------

# Stage 0: Agentic Data Ingestion
stage0_ingestion:
  max_tool_turns: 40
  llm:
    harness: codex
    model: gpt-5.5

# Stage 1: Structure Proposal (Orchestrator)
stage1_structure_proposal:
  sample_chunks: 10
  chunk_size: 100
  stage1a_max_tool_turns: 40
  stage1b_max_tool_turns: 40
  llm:
    harness: codex
    model: gpt-5.5

# Stage 2: Support-Window Extraction (Workers)
# Stage 2 fans out across thousands of workers; harness cold-start per worker
# is untenable, so `harness` is locked to `none` (enforced by config validator).
stage2_workers:
  windows_per_chunk: 1
  max_concurrent_workers: 30
  max_events_per_window: 300
  max_rpm: 450               # OpenRouter sliding-window RPM (embedded-only)
  worker_timeout: 120        # per-LLM-call timeout in seconds
  max_tool_turns: 40
  max_free_windows: 100
  llm:
    harness: none
    model: openrouter/deepseek/deepseek-v4-flash

# Stage 3: Validation — no LLM (rule-based)

# Stage 4: Model Specification & Prior Elicitation
stage4_prior_elicitation:
  max_tool_turns: 200
  literature_search:
    enabled: true
  paraphrasing:
    enabled: false
    n_paraphrases: 10
    gmm_model: null          # optional; null = inherit stage's llm.model
  llm:
    harness: codex
    model: gpt-5.5
    timeout: 3600           # 60-min per-turn ceiling for xhigh reasoning on the megaprompt

# Stages 5a/5b: Inference — no LLM (NumPyro SSM)

# Stage 6: Narrative Commentary
stage6_commentary:
  llm:
    harness: codex
    model: gpt-5.5

# --- Inference -------------------------------------------------------------
inference:
  method: marginal_particle_gibbs
  num_warmup: 4000
  num_samples: 1000
  num_chains: 4
  seed: 0
  compute_loo_diagnostics: false
  map:
    n_ieks_iters: 6
  marginal_particle_gibbs:
    n_particles: 64
    n_parameter_particles: 2
    # The indexed production method: parallel-in-time c-dSMC tree smoother with the
    # paid mixture leaf (amala_exact z-component + fixed IEKS-pilot component + wide
    # tail). Benchmarked in notebooks/inference_and_causal_walkthroughs.py §15-§16.
    latent_smoother: dsmc
    dsmc_leaf_proposal: paid_mix
    latent_delta: 0.2
    parameter_proposal: pseudo_langevin
    param_step_size: 0.02
    param_target_accept: 0.35
    adaptation_rate: 0.05
    init_method: pathfinder
    auto_preconditioner_method: pathfinder
